name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies (incl. optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ollama,postgres,files,odcs]"

      - name: Lint (syntax errors and undefined names)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run all test suites
        run: |
          set -e
          python run_tests.py
          for f in tests/*_tests.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies (incl. optional extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ollama,postgres,files,odcs]"

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off
