[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfard"
version = "0.1.0"
description = "Schema drift detection for REST APIs, databases and data lake files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    # langchain 1.x is required for langchain.agents.create_agent.
    # langchain-core>=1.2.5 fixes CVE-2025-68664 (serialization injection);
    # langgraph-checkpoint>=3.0 fixes CVE-2025-64439 (JsonPlusSerializer RCE).
    "langchain>=1.2.10",
    "langchain-core>=1.2.16",
    "langgraph>=1.0.10",
    "langgraph-checkpoint>=4.0.1",
    "langchain-anthropic>=1.3.4",
    "langchain-openai>=1.1.10",
    "mcp>=1.26,<2",
    "langchain-mcp-adapters>=0.2.1",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
# Parquet and ORC (Avro and Iceberg are read with the stdlib)
files = ["pyarrow>=18"]
ollama = ["langchain-ollama>=1.0"]
# ODCS contracts: YAML read/write and JSON Schema validation (JSON works without them)
odcs = ["pyyaml>=6", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/Ilya225/shelfard"
Repository = "https://github.com/Ilya225/shelfard"

[project.scripts]
shelfard = "shelfard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shelfard*"]
